[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-zero"
version = "0.2.7"
description = "Bounded binary protocol inference and provenance-aware evidence fusion"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["protocol_zero*"]

[project.optional-dependencies]
robust = ["numpy>=1.24"]
